<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goban</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚫</text></svg>">
    <link rel="stylesheet" href="styles/tailwind.min.css">
    <link rel="stylesheet" href="styles/font-awesome.min.css">
    <style>
        
        body {
            background-color: #111827;
            color: #e5e7eb;
        }
        
        .column {
            min-height: 400px;
            background-color: #1f2937;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        
        .ticket {
            background-color: #374151;
            border: 1px solid #4b5563;
            transition: all 0.2s;
        }
        
        .ticket:hover {
            border-color: #60a5fa;
            transform: translateY(-2px);
        }
        
        .column-header {
            background-color: #1f2937;
            border-bottom: 2px solid #4b5563;
        }
        
        .dragging {
            opacity: 0.4;
        }

        /* Drop zone indicators */
        .column.drag-over {
            background-color: #2d3748;
            border-color: #60a5fa;
            box-shadow: inset 0 0 10px rgba(96, 165, 250, 0.3);
        }

        .drop-indicator {
            height: 3px;
            background-color: #60a5fa;
            border-radius: 2px;
            margin: 4px 8px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }

        .drop-indicator.visible {
            opacity: 1;
            transform: scaleX(1);
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-screen-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold tracking-tight"><a href="go-board.html" target="_blank" rel="noopener noreferrer" class="text-white hover:text-gray-300 transition-colors">Goban</a></h1>
                <p class="text-gray-400 text-sm">Human + AI Kanban Board</p>
            </div>
            <div class="flex gap-4 items-center">
                <!-- Login Status Display -->
                <div id="loginStatus" class="hidden flex items-center gap-2 bg-gray-900 px-4 py-2 rounded-2xl relative">
                    <span class="text-xs text-green-400">✓</span>
                    <label class="text-xs text-gray-400 cursor-text">Logged in as:</label>
                    <span id="currentUserDisplay" class="bg-gray-800 border border-gray-700 text-white text-sm px-2 py-1 rounded min-w-[80px]"></span>
                    <span id="userRoleBadge" class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded hidden"></span>
                    <button onclick="logout()" class="text-xs text-gray-400 hover:text-white ml-2">Logout</button>
                </div>
                
                <!-- Login Button (shown when not logged in) -->
                <button id="loginBtn" onclick="showLoginModal()" 
                        class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-2xl text-sm font-medium transition-colors">
                    🔐 Login
                </button>
                
                <!-- Legacy username field (for non-auth users) -->
                <div id="legacyUserField" class="flex items-center gap-2 bg-gray-900 px-4 py-2 rounded-2xl relative">
                    <label for="currentUser" class="text-xs text-gray-400 cursor-text">You are:</label>
                    <input id="currentUser" type="text" placeholder="Enter your name..." maxlength="32" 
                           class="bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 w-24 px-2 py-1 rounded transition-colors"
                           aria-describedby="nameCharCounter">
                    <span id="nameCharCounter" class="text-xs text-gray-500 hidden" aria-live="polite"></span>
                </div>
                
                <!-- Search Bar -->
                <div class="relative w-80">
                    <input id="searchInput" type="text" placeholder="Search tickets..." 
                           onkeyup="if(event.key === 'Enter') filterTickets()"
                           class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-5 py-2 text-white text-sm focus:outline-none focus:border-blue-500 pl-10">
                    <span class="absolute left-3 top-2.5 text-gray-500">🔍</span>
                </div>

                <button onclick="showNewTicketModal()" 
                        class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-2xl text-sm font-medium transition-colors">
                    + New Ticket
                </button>

                <!-- Bulk Archive Button (only visible to admins) -->
                <button id="bulkArchiveBtn" onclick="bulkArchiveTickets()" 
                        class="hidden bg-red-600 hover:bg-red-500 px-4 py-2 rounded-2xl text-sm font-medium transition-colors">
                    🗄️ Bulk Archive
                </button>

                <!-- Board Selector Dropdown -->
                <div class="flex items-center gap-2 bg-gray-900 px-4 py-2 rounded-xl relative">
                    <label for="boardSelect" class="text-xs text-gray-400 cursor-default">📋 Board:</label>
                    <select id="boardSelect" onchange="switchBoard(this.value)"
                            class="bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none focus:border-blue-500 px-3 py-1 rounded transition-colors cursor-pointer">
                        <option value="" disabled selected>Loading boards...</option>
                    </select>
                </div>

                <!-- Board Tabs -->
                <div id="board-tabs" class="flex gap-1 bg-gray-900 p-1 rounded-xl">
                    <button onclick="switchView('board')" id="tab-board" 
                            class="px-4 py-2 text-sm font-medium rounded-lg transition-all bg-blue-600 text-white">Board</button>
                    <button onclick="switchView('archive')" id="tab-archive" 
                            class="px-4 py-2 text-sm font-medium rounded-lg transition-all hover:bg-gray-700 text-gray-300">Archive</button>
                </div>
            </div>
        </div>

        <!-- Board View -->
        <div id="boardView" class="">
            <!-- Kanban board layout (grid-cols-6 with col-span-2 ensures 3 equal-width columns; prevents vertical stacking) -->
            <div id="board" class="grid grid-cols-6 gap-4 pb-8 overflow-x-auto">
                <!-- Columns populated by JS -->
            </div>
        </div>

        <!-- Archive View (hidden by default) -->
        <div id="archiveView" class="hidden">
            <div class="bg-gray-900 rounded-xl border border-gray-700 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-white">🗄️ Archived Tickets</h2>
                    <span id="archiveCount" class="text-sm text-gray-400">Loading...</span>
                </div>
                
                <!-- Archive Search -->
                <div class="mb-4 relative w-full max-w-md">
                    <input id="archiveSearchInput" type="text" placeholder="Filter archived tickets..." 
                           onkeyup="if(event.key === 'Enter') filterArchive()"
                           class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500 pl-10">
                    <span class="absolute left-3 top-2.5 text-gray-500">🔍</span>
                </div>

                <!-- Archived Tickets Table -->
                <div id="archiveList" class="space-y-2">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- New Ticket Modal -->
    <div id="newTicketModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-gray-900 rounded-3xl p-8 w-full max-w-md modal">
            <h2 class="text-2xl font-semibold mb-6">New Ticket</h2>
            
            <div class="space-y-5">
                <div>
                    <div class="flex justify-between">
                        <label class="block text-sm text-gray-400 mb-1">Title <span class="text-red-400">*</span></label>
                        <span id="titleCount" class="text-xs text-gray-500">0/128</span>
                    </div>
                    <input id="ticketTitle" type="text" maxlength="128" 
                           class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="What needs to be done?" onkeyup="updateTitleCount()">
                </div>
                
                <div>
                    <div class="flex justify-between">
                        <label class="block text-sm text-gray-400 mb-1">Description</label>
                        <span id="descCount" class="text-xs text-gray-500">0/16384</span>
                    </div>
                    <textarea id="ticketDesc" maxlength="16384" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="More details..." onkeyup="updateDescCount()"></textarea>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Priority</label>
                        <select id="ticketPriority" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Assignee</label>
                        <input id="ticketAssignee" type="text" value="" placeholder="Optional assignee" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Due Date</label>
                        <input id="ticketDueDate" type="date" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Labels (comma separated)</label>
                    <input id="ticketLabels" type="text" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="bug, frontend, urgent">
                </div>
            </div>
            
            <div class="flex gap-3 mt-8">
                <button onclick="hideNewTicketModal()" 
                        class="flex-1 py-3 text-gray-400 hover:text-white transition-colors font-medium">
                    Cancel
                </button>
                <button onclick="createTicket()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-2xl font-medium transition-colors">
                    Create Ticket
                </button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-gray-900 rounded-3xl p-8 w-full max-w-md modal">
            <h2 class="text-2xl font-semibold mb-6">🔐 Login</h2>
            
            <div id="loginError" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-2xl mb-4 text-sm"></div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Username</label>
                    <input id="loginUsername" type="text" 
                           class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="Enter your username">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password</label>
                    <input id="loginPassword" type="password" 
                           class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="Enter your password">
                </div>
            </div>
            
            <div class="flex gap-3 mt-8">
                <button onclick="hideLoginModal()" 
                        class="flex-1 py-3 text-gray-400 hover:text-white transition-colors font-medium">
                    Cancel
                </button>
                <button onclick="performLogin()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-2xl font-medium transition-colors">
                    Login
                </button>
            </div>
        </div>
    </div>

    <!-- Ticket Detail Modal -->
    <div id="ticketDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
        <div class="bg-gray-900 rounded-3xl p-8 w-full max-w-2xl modal max-h-[90vh] overflow-auto">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="detailTitle" class="text-2xl font-semibold text-white"></h2>
                    <div id="detailTicketId" class="text-xs text-gray-500 font-mono mt-1"></div>
                </div>
                <button onclick="hideTicketDetail()" class="text-gray-400 hover:text-white text-2xl leading-none">×</button>
            </div>
            
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <div class="mb-6">
                        <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Title</div>
                        <input id="editTitle" type="text" maxlength="128" 
                               class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <div class="mb-6">
                        <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Assignee</div>
                        <input id="editAssignee" type="text" 
                               class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <div class="mb-6">
                        <div class="flex justify-between">
                            <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Due Date</div>
                            <span id="editDueCount" class="text-xs text-gray-500"></span>
                        </div>
                        <input id="editDueDate" type="date" 
                               class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <div class="mb-6">
                        <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Priority</div>
                        <select id="editPriority" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    
                    <div>
                        <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Labels (comma separated)</div>
                        <input id="editLabels" type="text" 
                               class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-blue-500"
                               placeholder="bug, frontend, urgent">
                    </div>
                </div>
            </div>
            
            <div class="mt-8">
                <div class="flex justify-between">
                    <div class="text-xs uppercase tracking-widest text-gray-500 mb-2">Description</div>
                    <span id="editDescCount" class="text-xs text-gray-500">0/16384</span>
                </div>
                <textarea id="detailDescriptionEdit" maxlength="16384" rows="5" 
                          class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-blue-500"
                          onkeyup="updateEditDescCount()"></textarea>
            </div>

            <div class="mt-10">
                <div class="text-xs uppercase tracking-widest text-gray-500 mb-3">Activity Log</div>
                
                <div class="flex gap-2 mb-4">
                    <input id="commentInput" type="text" maxlength="256"
                           class="flex-1 bg-gray-800 border border-gray-700 rounded-2xl px-5 py-3 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="Add a comment... (max 256 characters)"
                           onkeyup="updateCommentCount()">
                    <button onclick="postComment()" 
                            class="bg-blue-600 hover:bg-blue-500 px-8 rounded-2xl text-sm font-medium">
                        Post
                    </button>
                </div>
                <div class="text-right">
                    <span id="commentCount" class="text-xs text-gray-500">0/256</span>
                </div>
                
                <div id="activityLog" class="space-y-4 max-h-64 overflow-auto pr-2 text-sm mt-2"></div>
            </div>

            <!-- Subtasks Section -->
            <div class="mt-10">
                <div class="text-xs uppercase tracking-widest text-gray-500 mb-3 flex justify-between items-center">
                    <span>Subtasks</span>
                    <span id="subtaskProgress" class="text-blue-400">0/0</span>
                </div>
                
                <!-- Add subtask input -->
                <div class="flex gap-2 mb-4">
                    <input id="newSubtaskInput" type="text" maxlength="128"
                           class="flex-1 bg-gray-800 border border-gray-700 rounded-2xl px-5 py-3 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="Add a subtask...">
                    <button onclick="addSubtask()" 
                            class="bg-blue-600 hover:bg-blue-500 px-8 rounded-2xl text-sm font-medium">
                        Add
                    </button>
                </div>

                <!-- Subtasks list -->
                <div id="subtaskList" class="space-y-2 max-h-48 overflow-auto pr-2"></div>
            </div>
            
            <div class="mt-10 flex gap-3">
                <!-- Force Archive button - visible only to admins on DONE/REVIEW tickets -->
                <button id="forceArchiveBtn" onclick="forceArchiveTicket()" style="display:none;"
                        class="flex-1 bg-red-700 hover:bg-red-600 py-4 rounded-2xl font-medium transition-colors text-white">
                    Force Archive
                </button>
                
                <button onclick="hideTicketDetail()" 
                        class="flex-1 py-4 text-gray-400 hover:text-white font-medium transition-colors border border-gray-700 rounded-2xl">
                    Cancel
                </button>
                <button id="releasePoolButton" onclick="releaseCurrentTicket()" style="display:none"
                        class="flex-1 bg-yellow-600 hover:bg-yellow-500 py-4 rounded-2xl font-medium transition-colors text-white"
                        title="Release ticket back to the TODO pool (clear assignee)">
                    Release to Pool
                </button>
                <button onclick="saveTicketChanges()" 
                        class="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-medium transition-colors">
                    Save Changes
                </button>
                <button onclick="deleteCurrentTicket()" 
                        class="flex-1 bg-red-600 hover:bg-red-500 py-4 rounded-2xl font-medium transition-colors text-white">
                    Delete
                </button>
            </div>
        </div>
    </div>

        <script src="app.js?v=2026050716"></script>
</body>
</html>
